[uwsgi]
# Service name
site-name	= backend

# User, group, folder
chdir = /code

http = :8000
module = app.wsgi:application
master = true

# wsgi-file       = app/wsgi.py
import          = app.uwsgi_tasks
memory-report   = true

# Processes
vacuum          = true
processes       = 12 # Maximum number of workers allowed
cheaper		    = 4 # Minimum number of workers allowed
cheaper-algo    = busyness
cheaper-initial = 4 # Workers created at startup
cheaper-overload = 1 # Length of a cycle in seconds
cheaper-step    = 1 # How many workers to spawn at a time

cheaper-busyness-multiplier = 30 # How many cycles to wait before killing workers
cheaper-busyness-min = 20 # Below this threshold, kill workers (if stable for multiplier cycles)
cheaper-busyness-max = 70 # Above this threshold, spawn new workers
cheaper-busyness-backlog-alert = 16 # Spawn emergency workers if more than this many requests are waiting in the queue
cheaper-busyness-backlog-step = 3 # How many emergency workers to create if there are too many requests in the queue

# Respawn/restart processes
max-requests    = 5000 # respawn processes after serving 5000 requests
max-worker-lifetime = 3600 # Restart workers after this many seconds
reload-on-rss   = 2048 # Restart workers after this much resident memory
worker-reload-mercy = 60 # How long to wait before forcefully killing workers
harakiri        = 20 # respawn processes taking more than 20 seconds

# Logging
logto	        = /var/log/uwsgi/%(site-name).log