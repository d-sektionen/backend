[project]
name = "backend"
version = "0.0.0"
description = "The backend and API for D-sektionens member services."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "Django==6.1.3",
    "djangorestframework==3.18.3",
    "djangorestframework-simplejwt==5.5.1",
    "django-ical==1.10.0",
    "requests==2.34.2",
    "drf-writable-nested==0.7.2",
    "django-cors-headers==4.9.0",
    "icalendar==4.0.7",
    "django-model-utils==5.0.0",
    "django-imagekit==6.1.1",
    "yalexs==8.7.1",
    "python-dotenv==1.2.4",
    "django-post_office==3.13.0",
    "nh3==0.3.8",
    "psycopg[binary]==3.3.9",
    "minify-html==0.18.1",
    "msal==1.39.0",
    "channels==4.3.2",
    "python-socketio[asyncio_client]==5.18.1",
    "uvicorn==0.54.0",
    "redis==7.4.0",
]

[dependency-groups]
# Installed by default by `uv sync`; leave out with `--no-dev`.
dev = [
    "factory_boy==3.3.3",
    "ruff==0.17.6",
    "django-stubs==6.1.2",
]
# Only needed by the production image: `uv sync --no-dev --group production`.
production = [
    "gunicorn==25.3.0",
]

[tool.uv]
# This is an application, not a library: install the dependencies only.
package = false
