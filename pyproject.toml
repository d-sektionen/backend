[project]
name = "backend"
version = "0.0.0"
description = "The backend and API for D-sektionens member services."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "Django==4.2.14",
    "djangorestframework==3.15.2",
    "djangorestframework-simplejwt==5.3.1",
    "django-ical==1.9.2",
    "requests==2.32.3",
    "drf-writable-nested==0.7.0",
    "django-cors-headers==4.4.0",
    "icalendar==4.0.7",
    "django-model-utils==5.0.0",
    "django-imagekit==5.0.0",
    "yalexs==8.7.1",
    "python-dotenv==1.0.1",
    "django-post_office==3.9.0",
    "psycopg[binary]==3.3.3",
    "nh3==0.3.2",
    "minify-html==0.18.1",
    "identity[django]==0.9.2",
    "channels==4.3.2",
    "python-socketio[asyncio_client]==5.16.1",
    "uvicorn==0.44.0",
    "redis==7.4.0",
]

[dependency-groups]
# Installed by default by `uv sync`; leave out with `--no-dev`.
dev = [
    "factory_boy==3.3.0",
    "ruff==0.16.8",
    "django-stubs==5.2.7",
]
# Only needed by the production image: `uv sync --no-dev --group production`.
production = [
    "gunicorn==25.3.0",
]

[tool.uv]
# This is an application, not a library: install the dependencies only.
package = false
