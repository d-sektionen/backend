name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - development

# PRs share a group per branch so superseded runs are cancelled. Pushes get a
# group per commit: GitHub cancels *pending* runs in a shared group even with
# cancel-in-progress off, which would leave merged commits untested.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    # Job names are required status checks in the repo ruleset; keep them in sync.
    name: Lint code (3.12)
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up uv
        # Installs the Python version from .python-version.
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Run linter
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

  test:
    name: Unit tests (3.12)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.3-alpine
        env:
          POSTGRES_DB: django
          POSTGRES_USER: django
          POSTGRES_PASSWORD: django
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U django -d django"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_NAME: django
      POSTGRES_USER: django
      POSTGRES_PASSWORD: django
      CLIENT_ID: ${{ secrets.CLIENT_ID }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up uv
        # Installs the Python version from .python-version.
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Check for missing migrations
        # manage.py only selects settings_test for the `test` command.
        env:
          DJANGO_SETTINGS_MODULE: backend.app.settings_test
        run: uv run python manage.py makemigrations --check --dry-run

      - name: Run tests
        run: uv run python manage.py test

  docker:
    name: Docker build (${{ matrix.dockerfile }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dockerfile:
          - Dockerfile
          - Dockerfile.development
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          cache-from: type=gha,scope=${{ matrix.dockerfile }}
          cache-to: type=gha,mode=max,scope=${{ matrix.dockerfile }}
