version: "3.12"

services:
  dev_database:
    image: postgres:15.3
    restart: on-failure
    environment:
      POSTGRES_USER: django
      POSTGRES_PASSWORD: django
    volumes:
      - backend_dev_db_data:/var/lib/postgresql/data
    ports:
      - 127.0.0.1:5432:5432
    networks:
      - internal # network internal

  backend_dev:
    build: .
    restart: on-failure
    command: uwsgi --ini /srv/backend.uwsgi.ini
    volumes:
      - ./backend.uwsgi.ini:/srv/backend.uwsgi.ini
    ports:
      - 0.0.0.0:8002:8000
    environment:
      POSTGRES_NAME: django
      POSTGRES_USER: django
      POSTGRES_PASSWORD: django
      POSTGRES_HOST: dev_database
      POSTGRES_PORT: 5432
    networks:
      - internal # network internal
      - default # network outside
    depends_on:
      - dev_database

volumes:
  backend_dev_db_data:

networks:
  default:
    name: backend_dev_network
  internal:
    internal: true
