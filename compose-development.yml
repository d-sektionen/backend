services:
  postgres:
    image: postgres:16.3-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: django
      POSTGRES_PASSWORD: django
    volumes:
      - postgresql_data:/var/lib/postgresql/data
    ports:
      - 5432:5432
    networks:
      - internal

  backend:
    image: registry.d-sektionen.se/backend:development
    restart: unless-stopped
    command: uwsgi --ini /etc/uwsgi/backend.uwsgi.ini
    volumes:
      # Set the paths when deploying to development environment.
      - ${BACKEND_DEV_BASEDIR}/backend.uwsgi.ini:/etc/uwsgi/backend.uwsgi.ini
      - ${BACKEND_DEV_BASEDIR}/static:/code/static
      - ${BACKEND_DEV_BASEDIR}/media:/code/media
      - ${BACKEND_DEV_BASEDIR}/log:/var/log
    ports:
      # Update for development environment
      - 10000:8000
    environment:
      POSTGRES_NAME: django
      POSTGRES_USER: django
      POSTGRES_PASSWORD: django
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    env_file:
      # Environment variables set in portainer gui.
      - stack.env
    networks:
      - internal
      - default
    depends_on:
      - postgres

  home_assistant:
    container_name: D-sektionen-HA
    image: "ghcr.io/home-assistant/home-assistant:stable"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${BACKEND_DEV_BASEDIR}/HA-config:/config
    ports:
      - 8123:8123
    networks:
      - default
      - backend-homeassistant

volumes:
  postgresql_data:

networks:
  default:
    driver: bridge
    name: backend_dev_network
  internal:
    internal: true
  backend-homeassistant:
    internal: true
