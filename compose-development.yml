version: "3.12"

services:
  dev_database:
    image: postgres:16.2-alpine
    restart: on-failure
    environment:
      POSTGRES_USER: django
      POSTGRES_PASSWORD: django
    volumes:
      - dev_db_data:/var/lib/postgresql/data
    ports:
      - 127.0.0.1:5432:5432
    networks:
      - internal # network internal

  dev_app:
    image: registry.d-sektionen.se/backend:development # Specify backend image
    restart: on-failure
    command: uwsgi --ini /srv/backend.uwsgi.ini
    volumes:
      # Set the paths when deploying to development environment.
      #- [ini file path]:/srv/backend.uwsgi.ini
      #- [static files path]:/code/static
      #- [log file path]:/var/log/uwsgi/
    ports:
      - 127.0.0.1:XXXX:8000
    environment:
      POSTGRES_NAME: django
      POSTGRES_USER: django
      POSTGRES_PASSWORD: django
      POSTGRES_HOST: dev_database
      POSTGRES_PORT: 5432
    env_file:
      # Environment variable file for keys and secrets for azure authentication.
      - XXXX/.env
    networks:
      - internal # network internal
      - default # network outside
    depends_on:
      - dev_database

volumes:
  dev_db_data:

networks:
  default:
    name: backend_dev_network
  internal:
    internal: true
