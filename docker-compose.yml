# DEVELOPMENT MODE ONLY

services:
  postgres:
    image: postgres:16.3-alpine
    environment:
      POSTGRES_NAME: ${POSTGRES_NAME}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgresql_data:/var/lib/postgresql/data
    ports:
      - 5432:5432
    networks:
      - internal
      - default

  backend:
    build:
      context: .
      dockerfile: Dockerfile.development
    volumes:
      - ./backend:/app/backend
    ports:
      - 8000:8000
    environment:
      POSTGRES_NAME: ${POSTGRES_NAME}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
    env_file:
      - .env
    networks:
      - internal
      - default
    post_start:
      - command: sh -c "python manage.py makemigrations
                        && python manage.py migrate
                        && (python manage.py createsuperuser --username ${SUPERUSER_USERNAME} --email ${SUPERUSER_EMAIL} --noinput --skip-checks 2>/dev/null || true)"
        user: root
    depends_on:
      - postgres

  home_assistant:
    container_name: D-sektionen-HA
    image: "ghcr.io/home-assistant/home-assistant:stable"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${BACKEND_DEV_BASEDIR}/HA-config:/config
    ports:
      - 8123:8123
    networks:
      - default
      - backend-homeassistant

volumes:
  postgresql_data:

networks:
  default:
    driver: bridge
    name: backend_dev_network
  internal:
    internal: true
  backend-homeassistant:
    internal: true
